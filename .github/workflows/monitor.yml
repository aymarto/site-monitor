name: Surveillance des sites

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (GitHub peut décaler de quelques minutes)
  push:
    paths: [TEST_WHATSAPP]  # modifier ce fichier envoie un message WhatsApp de test
  workflow_dispatch:
    inputs:
      mode:
        description: "check = vérifier les sites, test = envoyer un message WhatsApp de test"
        default: check
        type: choice
        options: [check, test]

permissions:
  contents: write   # pour enregistrer state.json (pannes en cours)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les sites
        env:
          SITES: ${{ secrets.SITES }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'test') || 'check' }}
        run: python monitor.py

      - name: Enregistrer l'état
        if: always()
        run: |
          if ! git diff --quiet -- state.json 2>/dev/null || [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "site-monitor"
            git config user.email "site-monitor@users.noreply.github.com"
            git add state.json
            git commit -m "Mise à jour de l'état [skip ci]"
            git push
          fi
